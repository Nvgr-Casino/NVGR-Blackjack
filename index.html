<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so the table fills the screen behind the notch and
       home bar (the HUD already pads itself with env(safe-area-inset-*)).
       maximum-scale pairs with touch-action:none on the canvas to keep a
       two-finger pinch as a camera zoom instead of a page zoom. -->
  <meta name="theme-color" content="#0d0b0a" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>NVGR Blackjack 21</title>
  <link rel="icon" type="image/png" href="./src/assets/nvgr-mark.png" />
  <!-- Played like an app: added to the home screen it opens full screen with
       its own icon (manifest.webmanifest; on an iPhone, the apple tags). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NVGR Casino" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <canvas id="scene" style="display:none"></canvas>
  <!-- Black until the opening (src/app/intro.js) takes over. -->
  <div id="root" class="wrap" style="background:#000"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
