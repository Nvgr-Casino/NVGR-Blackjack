name: Android APK

# Builds the Android app (NVGR Casino) from the same code as the website
# on every push, and publishes it as NVGR-Casino.apk on the repository's
# "android" release, so one link always downloads the newest:
#   https://github.com/Nvgr-Casino/NVGR-Blackjack/releases/download/android/NVGR-Casino.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a build still running.
concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync android

      # The release key, from the repository's secrets. Without it the app is
      # signed with a throwaway debug key: it installs, but a later build
      # cannot update it in place.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "GRADLE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK."
            echo "GRADLE_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew "$GRADLE_TASK" --no-daemon

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APK_PATH" NVGR-Casino.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "NVGR Casino for Android" --notes "The newest Android app."
          gh release upload android NVGR-Casino.apk --clobber
          gh release delete-asset android Golden-Ace-Casino.apk -y 2>/dev/null || true
          gh release edit android --title "NVGR Casino for Android" --notes "NVGR Casino: version 1.0.${{ github.run_number }}, built from ${GITHUB_SHA::7}. Download NVGR-Casino.apk on your Android phone and open it to install."
